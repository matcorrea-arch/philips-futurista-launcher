
name: Build Philips Futurista APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$ZIP_FILE" -d source

      - name: Compilar aplicativo
        run: |
          sed -i 's/compileSdk 35/compileSdk 34/' source/app/build.gradle
          gradle -p source assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Philips-Futurista-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
